# Agent 03 - local single-machine demo
# Group 10 - Server Health Monitoring System
#
# On the local demo all four agents share one machine, so each one needs its own
# TCP port. When each agent runs on its own machine they may all use port 5000.

agent.id=AGENT-03
agent.name=LOCAL-AGENT-03

# Address of the monitoring client.
monitor.host=127.0.0.1
monitor.udp.port=6000

# Port this agent listens on for TCP control messages.
agent.tcp.port=5003

# How often telemetry and heartbeats are sent, in milliseconds.
metric.interval.ms=1000
heartbeat.interval.ms=5000

# Shared secret used to sign every UDP packet. It must match the secret
# registered for this agent on the monitoring client. Each agent has its own, so
# one leaked secret cannot be used to impersonate the others.
security.sharedSecret=GROUP10_DEMO_SECRET_03

# Local copies of the alert thresholds. The monitoring client is what raises
# alerts; these values are what the agent reports back in a CONFIG_ACK and what a
# CONFIG_UPDATE changes.
alert.cpu.threshold=85.0
alert.memory.threshold=85.0
alert.network.in.threshold.mbps=50.0
alert.network.out.threshold.mbps=50.0
