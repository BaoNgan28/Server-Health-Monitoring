<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-2%" y="-6%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="840" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="24" font-weight="bold" fill="#0F172A">Các lớp của monitor-app</text>
  <text x="40" y="70" font-size="13" fill="#64748B">Server Health Monitoring — Group 10 HUTECH</text>
  <line x1="40" y1="88" x2="1360" y2="88" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Lop 1: Giao dien Swing -->
  <g>
    <rect x="40" y="110" width="1100" height="100" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="74" cy="151" r="11" fill="#2563EB"/>
    <text x="74" y="155.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="95" y="156" font-size="15" font-weight="bold" fill="#0F172A">Giao diện Swing (UI)</text>
    <text x="95" y="178" font-size="11" fill="#64748B">MainFrame + 5 tab, bảng, biểu đồ</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1E293B" text-anchor="middle">
      <rect x="300" y="131" width="77" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="338.5" y="148.5">MainFrame</text>
      <rect x="387" y="131" width="110" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="442" y="148.5">DashboardPanel</text>
      <rect x="507" y="131" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="572" y="148.5">ServerDetailPanel</text>
      <rect x="300" y="163" width="97" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="348.5" y="180.5">HistoryPanel</text>
      <rect x="407" y="163" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="449" y="180.5">AlertPanel</text>
      <rect x="501" y="163" width="143" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="572.5" y="180.5">TimeSeriesChartPanel</text>
    </g>
  </g>

  <!-- Lop 2: Service / dieu phoi -->
  <g>
    <rect x="40" y="236" width="1100" height="100" rx="14" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="74" cy="277" r="11" fill="#7C3AED"/>
    <text x="74" y="281.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="95" y="282" font-size="15" font-weight="bold" fill="#0F172A">Service / điều phối</text>
    <text x="95" y="304" font-size="11" fill="#64748B">Telemetry, cảnh báo, event bus</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1E293B" text-anchor="middle">
      <rect x="300" y="257" width="117" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="358.5" y="274.5">TelemetryService</text>
      <rect x="427" y="257" width="97" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="475.5" y="274.5">AlertService</text>
      <rect x="534" y="257" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="599" y="274.5">AggregationService</text>
      <rect x="300" y="289" width="117" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
