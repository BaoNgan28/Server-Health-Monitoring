  <!-- Mang duoi: monitoring-common -->
  <g>
    <rect x="40" y="744" width="1100" height="60" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="74" cy="765" r="11" fill="#7C3AED"/>
    <text x="74" y="769.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="95" y="770" font-size="14" font-weight="bold" fill="#6D28D9">monitoring-common</text>
    <text x="95" y="790" font-size="11" fill="#64748B">Giao thức và mã hóa dùng chung</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1E293B" text-anchor="middle">
      <rect x="300" y="761" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="365" y="778.5">ProtocolConstants</text>
      <rect x="440" y="761" width="124" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="502" y="778.5">JsonMessageCodec</text>
      <rect x="574" y="761" width="91" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="619.5" y="778.5">PacketSigner</text>
      <rect x="675" y="761" width="71" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="710.5" y="778.5">TimeUtil</text>
      <rect x="756" y="761" width="117" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="814.5" y="778.5">PacketValidator</text>
    </g>
