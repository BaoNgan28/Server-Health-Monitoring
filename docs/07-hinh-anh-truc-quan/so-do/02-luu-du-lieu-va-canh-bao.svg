<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#FFFFFF"/>

  <!-- Tiêu đề -->
  <text x="30" y="48" font-size="22" font-weight="bold" fill="#0F172A">Sơ đồ luồng dữ liệu &amp; cảnh báo</text>
  <text x="30" y="70" font-size="12" fill="#64748B">Server Health Monitoring — Group 10 HUTECH</text>
  <line x1="30" y1="86" x2="1370" y2="86" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Hàng 1: bước 1–4 ===== -->

  <!-- Bước 1 -->
  <rect x="30" y="120" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="56" cy="146" r="13" fill="#2563EB"/>
  <text x="56" y="150" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="78" y="151" font-size="14" font-weight="bold" fill="#1E40AF">Gói telemetry UDP</text>
  <rect x="48" y="166" width="88" height="22" rx="11" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="92" y="181" font-size="11" font-family="Consolas, monospace" fill="#1D4ED8" text-anchor="middle">UDP :6000</text>
  <text x="146" y="181" font-size="11" fill="#64748B">mẫu 1000 ms</text>
  <text x="48" y="206" font-size="11" fill="#64748B">telemetry + heartbeat · ≤ 4096 B</text>

  <!-- Bước 2 -->
  <rect x="343" y="120" width="320" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="369" cy="146" r="13" fill="#DC2626"/>
  <text x="369" y="150" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="391" y="151" font-size="14" font-weight="bold" fill="#991B1B">Xác thực HMAC-SHA256</text>
  <text x="361" y="176" font-size="12.5" fill="#475569">+ chống replay (sequence / timestamp,</text>
  <text x="361" y="196" font-size="12.5" fill="#475569">cửa sổ <tspan font-family="Consolas, monospace">64</tspan> gói)</text>
  <text x="361" y="213" font-size="11" fill="#64748B">sai HMAC / replay → cảnh báo bảo mật</text>

  <!-- Bước 3 -->
  <rect x="726" y="120" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="752" cy="146" r="13" fill="#2563EB"/>
  <text x="752" y="150" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="774" y="151" font-size="14" font-weight="bold" fill="#1E40AF">Lưu bảng <tspan font-family="Consolas, monospace">metric_raw</tspan></text>
  <text x="744" y="176" font-size="12.5" fill="#475569">mỗi gói hợp lệ → đúng 1 dòng</text>
  <text x="744" y="200" font-size="11" fill="#64748B">SQLite · index (agent_id, timestamp)</text>

  <!-- Bước 4 -->
  <rect x="1039" y="120" width="331" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="1065" cy="146" r="13" fill="#7C3AED"/>
  <text x="1065" y="150" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1087" y="151" font-size="14" font-weight="bold" fill="#5B21B6">Tổng hợp cửa sổ 5 phút</text>
  <text x="1057" y="176" font-size="12.5" fill="#475569">bảng <tspan font-family="Consolas, monospace">metric_5m</tspan> — AVG + MAX mỗi bucket</text>
  <text x="1057" y="200" font-size="11" fill="#64748B">job 300 s · UNIQUE (agent_id, bucket_start)</text>

  <!-- Mũi luồng chính hàng 1 -->
  <path d="M280,170 H337" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <path d="M663,170 H720" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <path d="M976,170 H1033" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#mBlue)"/>

  <!-- Chip nhãn hàng 1 -->
  <rect x="282" y="161" width="58" height="18" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="311" y="174" font-size="10.5" font-family="Consolas, monospace" fill="#475569" text-anchor="middle">≤ 4096 B</text>
  <rect x="667" y="161" width="54" height="18" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="694" y="174" font-size="11" fill="#475569" text-anchor="middle">hợp lệ</text>
  <rect x="979" y="161" width="56" height="18" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1007" y="174" font-size="11" fill="#475569" text-anchor="middle">mẫu thô</text>

  <!-- Mũi bọc hàng 1 → hàng 2 -->
  <path d="M1204,220 V272 H200 V334" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <rect x="633" y="262" width="134" height="19" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="700" y="275" font-size="11" fill="#475569" text-anchor="middle">mỗi mẫu &amp; mỗi bucket</text>

  <!-- ===== Hàng 2: bước 5–7 ===== -->

  <!-- Bước 5 -->
  <rect x="30" y="340" width="340" height="214" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="56" cy="366" r="13" fill="#EA580C"/>
  <text x="56" y="370" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="78" y="371" font-size="14" font-weight="bold" fill="#9A3412">Kiểm tra ngưỡng cảnh báo</text>

  <circle cx="49" cy="394" r="2.5" fill="#EA580C"/>
  <text x="62" y="398" font-size="12" fill="#334155">CPU &gt; 85 % · hysteresis 2.0 điểm %</text>
  <circle cx="49" cy="416" r="2.5" fill="#EA580C"/>
  <text x="62" y="420" font-size="12" fill="#334155">RAM &gt; 85 % · hysteresis 2.0 điểm %</text>
  <circle cx="49" cy="438" r="2.5" fill="#EA580C"/>
  <text x="62" y="442" font-size="12" fill="#334155">Mạng vào / ra &gt; 50 Mbps · hysteresis 5 %</text>
  <circle cx="49" cy="460" r="2.5" fill="#EA580C"/>
  <text x="62" y="464" font-size="12" fill="#334155">Offline: quá 15 000 ms không có gói hợp lệ</text>
  <circle cx="49" cy="482" r="2.5" fill="#EA580C"/>
  <text x="62" y="486" font-size="12" fill="#334155">≤ 1 OPEN / (agent, loại) — không spam email</text>
  <circle cx="49" cy="504" r="2.5" fill="#EA580C"/>
  <text x="62" y="508" font-size="12" fill="#334155">Bảo mật: rate limit 60 000 ms · không email</text>
  <text x="62" y="531" font-size="11" fill="#94A3B8">Ổ cứng: AlertType không có loại DISK (đúng 8 loại)</text>

  <!-- Bước 6 -->
  <rect x="433" y="340" width="440" height="110" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="459" cy="366" r="13" fill="#EA580C"/>
  <text x="459" y="370" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="481" y="371" font-size="14" font-weight="bold" fill="#9A3412">Tạo bản ghi alerts</text>
  <text x="451" y="397" font-size="12.5" fill="#475569">bảng <tspan font-family="Consolas, monospace">alerts</tspan> — 1 sự kiện OPEN / (agent, loại)</text>
  <text x="451" y="419" font-size="11" fill="#64748B">severity INFO / WARNING / CRITICAL · OPEN → RESOLVED (hysteresis)</text>
  <text x="451" y="437" font-size="11" fill="#64748B">cùng lúc: ghi DB · GUI AlertPanel · notifier</text>

  <!-- Bước 7 -->
  <rect x="936" y="340" width="434" height="110" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="962" cy="366" r="13" fill="#16A34A"/>
  <text x="962" y="370" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="984" y="371" font-size="14" font-weight="bold" fill="#15803D">Hàng đợi email → SMTP</text>
  <text x="954" y="397" font-size="12.5" fill="#475569">ArrayBlockingQueue(50) · 1 thread <tspan font-family="Consolas, monospace">email-sender</tspan></text>
  <rect x="954" y="410" width="170" height="22" rx="11" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="1039" y="425" font-size="11" font-family="Consolas, monospace" fill="#15803D" text-anchor="middle">smtp :587 · STARTTLS</text>
  <text x="1140" y="425" font-size="11" fill="#64748B">đầy → bỏ + log warning</text>

  <!-- Mũi luồng chính hàng 2 -->
  <path d="M370,395 H427" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <path d="M873,395 H930" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#mBlue)"/>

  <!-- Chip nhãn hàng 2 -->
  <rect x="375" y="386" width="53" height="18" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="401.5" y="399" font-size="11" fill="#475569" text-anchor="middle">OPEN</text>
  <rect x="877" y="386" width="55" height="18" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="904.5" y="399" font-size="11" fill="#475569" text-anchor="middle">notifier</text>

  <!-- ===== Kênh điều khiển (side lane) ===== -->
  <rect x="440" y="610" width="640" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#ds)"/>
  <text x="464" y="638" font-size="14" font-weight="bold" fill="#334155">Kênh điều khiển <tspan font-family="Consolas, monospace">TCP 5000</tspan> — cập nhật cấu hình, lệnh heartbeat</text>
  <text x="464" y="662" font-size="11.5" fill="#64748B">Khung 4 byte big-endian + JSON UTF-8 · PING / CONFIG_UPDATE / CONFIG_ACK · timeout 5000 ms</text>

  <!-- Mũi nét đứt: điều khiển agent quay về bước 1 -->
  <path d="M1080,648 H1376 V104 H165 V116" fill="none" stroke="#64748B" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#mGray)"/>
  <rect x="704" y="94" width="132" height="20" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="770" y="108" font-size="11" fill="#475569" text-anchor="middle">điều khiển agent</text>

  <!-- Ghi chú nguồn -->
  <text x="30" y="588" font-size="11" fill="#94A3B8">Nguồn: 07-canh-bao-va-thong-bao.md · 04-giao-thuc-tcp-udp.md · 06-luu-tru-va-tong-hop.md</text>
</svg>
