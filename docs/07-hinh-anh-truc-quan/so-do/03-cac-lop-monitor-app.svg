      <text x="596" y="306.5">MonitorEventBus</text>
    </g>
  </g>

  <!-- Lop 3: Network -->
  <g>
    <rect x="40" y="362" width="1100" height="100" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="74" cy="403" r="11" fill="#EA580C"/>
    <text x="74" y="407.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="95" y="408" font-size="15" font-weight="bold" fill="#0F172A">Network</text>
    <text x="95" y="430" font-size="11" fill="#64748B">Nhận gói UDP, kết nối TCP</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1E293B" text-anchor="middle">
      <rect x="300" y="399" width="150" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="375" y="416.5">UdpTelemetryReceiver</text>
      <rect x="460" y="399" width="143" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="531.5" y="416.5">AgentTcpConnection</text>
      <rect x="613" y="399" width="176" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="701" y="416.5">AgentTcpConnectionManager</text>
    </g>
  </g>

  <!-- Lop 4: Storage -->
  <g>
    <rect x="40" y="488" width="1100" height="100" rx="14" fill="#F0FDF4" stroke="#34D399" stroke-width="1.5" filter="url(#softShadow)"/>
