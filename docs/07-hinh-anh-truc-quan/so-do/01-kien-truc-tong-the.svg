<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16A34A"/>
    </marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EA580C"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="#FFFFFF"/>

  <!-- Tiêu đề -->
  <text x="30" y="48" font-size="22" font-weight="bold" fill="#0F172A">Sơ đồ kiến trúc tổng thể</text>
  <text x="30" y="70" font-size="12" fill="#64748B">Server Health Monitoring — Group 10 HUTECH</text>
  <line x1="30" y1="86" x2="1370" y2="86" stroke="#E2E8F0" stroke-width="1"/>

  <!-- monitoring-common -->
  <rect x="30" y="150" width="240" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#ds)"/>
  <text x="150" y="198" font-size="14" font-weight="bold" fill="#6D28D9" text-anchor="middle">monitoring-common</text>
  <text x="150" y="224" font-size="10.5" fill="#7C3AED" text-anchor="middle">codec · PacketSigner · TimeUtil</text>

  <!-- liên hệ mỏng: common -> monitor, common -> agent -->
  <path d="M270,205 H318" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mPurple)"/>
  <path d="M150,150 V106 H1215 V138" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mPurple)"/>

  <!-- Monitoring Client (monitor-app) -->
  <rect x="320" y="120" width="560" height="420" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#ds)"/>
  <text x="344" y="150" font-size="14" font-weight="bold" fill="#1E40AF">Monitoring Client (monitor-app)</text>
  <line x1="344" y1="162" x2="856" y2="162" stroke="#BFDBFE" stroke-width="1"/>

  <!-- 4 hop nội bộ -->
  <rect x="344" y="180" width="236" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="462" y="220" font-size="12.5" fill="#1E3A8A" text-anchor="middle">Giao diện Swing</text>

  <rect x="620" y="180" width="236" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="738" y="220" font-size="12.5" fill="#1E3A8A" text-anchor="middle">Tổng hợp &amp; rules</text>

  <rect x="344" y="296" width="236" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="462" y="336" font-size="12.5" fill="#1E3A8A" text-anchor="middle">Server điều khiển <tspan font-family="Consolas, monospace">TCP :5000</tspan></text>

  <rect x="620" y="296" width="236" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="738" y="336" font-size="12.5" fill="#1E3A8A" text-anchor="middle">Nhận telemetry <tspan font-family="Consolas, monospace">UDP :6000</tspan></text>

  <!-- luồng nội bộ -->
  <path d="M738,296 V254" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mBlue)"/>
  <path d="M620,216 H582" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mBlue)"/>
  <path d="M462,252 V294" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mBlue)"/>
  <path d="M738,368 V400 H462 V428" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mBlue)"/>

  <!-- Lưu SQLite + Email SMTP -->
  <rect x="344" y="430" width="236" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="462" y="472" font-size="12.5" fill="#1E3A8A" text-anchor="middle">Lưu SQLite</text>

  <rect x="620" y="430" width="236" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4" filter="url(#ds)"/>
  <text x="738" y="464" font-size="12.5" font-weight="bold" fill="#991B1B" text-anchor="middle">Email SMTP</text>
  <text x="738" y="484" font-size="9.5" fill="#DC2626" text-anchor="middle">jakarta.mail · SMTP</text>

  <path d="M856,216 H868 V466 H858" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#mGray)"/>

  <!-- Cột agent -->
  <rect x="1060" y="140" width="310" height="76" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1080" y="174" font-size="13" font-weight="bold" fill="#14532D">Agent-01</text>
  <text x="1080" y="194" font-size="10.5" fill="#16A34A">(agent-app)</text>

  <rect x="1060" y="246" width="310" height="76" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1080" y="280" font-size="13" font-weight="bold" fill="#14532D">Agent-02</text>
  <text x="1080" y="300" font-size="10.5" fill="#16A34A">(agent-app)</text>

  <rect x="1060" y="352" width="310" height="76" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1080" y="386" font-size="13" font-weight="bold" fill="#14532D">Agent-03</text>
  <text x="1080" y="406" font-size="10.5" fill="#16A34A">(agent-app)</text>

  <rect x="1060" y="458" width="310" height="76" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1080" y="492" font-size="13" font-weight="bold" fill="#14532D">Agent-04</text>
  <text x="1080" y="512" font-size="10.5" fill="#16A34A">(agent-app)</text>

  <rect x="1060" y="564" width="310" height="76" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1080" y="598" font-size="13" font-weight="bold" fill="#7C2D12">Simulator</text>
  <text x="1080" y="618" font-size="10.5" fill="#EA580C">(simulator-app)</text>

  <!-- agent -> monitor (telemetry) -->
  <path d="M1058,168 H882" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#mBlue)"/>
  <path d="M1058,274 H882" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#mBlue)"/>
  <path d="M1058,380 H882" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#mBlue)"/>
  <path d="M1058,486 H882" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#mBlue)"/>

  <!-- monitor -> agent (cau hinh) -->
  <path d="M882,188 H1058" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#mGreen)"/>
  <path d="M882,294 H1058" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#mGreen)"/>
  <path d="M882,400 H1058" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#mGreen)"/>
  <path d="M882,506 H1058" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#mGreen)"/>

  <!-- simulator -> monitor (dashed) -->
  <path d="M1058,602 H920 V528 H882" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#mOrange)"/>

  <!-- nhan duong dan -->
  <rect x="886" y="310" width="168" height="54" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="970" y="332" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">Telemetry &amp; Heartbeat</text>
  <text x="970" y="350" font-size="10" fill="#2563EB" text-anchor="middle" font-family="Consolas, monospace">UDP 6000 · HMAC-SHA256</text>

  <rect x="905" y="214" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1"/>
  <text x="970" y="236" font-size="11" font-weight="bold" fill="#14532D" text-anchor="middle">Cấu hình &amp; lệnh</text>
  <text x="970" y="254" font-size="10" fill="#16A34A" text-anchor="middle" font-family="Consolas, monospace">TCP 5000</text>

  <rect x="905" y="626" width="130" height="48" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
  <text x="970" y="646" font-size="11" font-weight="bold" fill="#7C2D12" text-anchor="middle">Gói kiểm thử</text>
  <text x="970" y="664" font-size="10" fill="#EA580C" text-anchor="middle" font-family="Consolas, monospace">UDP 6000</text>

  <!-- Chú thích -->
  <rect x="30" y="560" width="250" height="270" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="46" y="588" font-size="12.5" font-weight="bold" fill="#0F172A">Chú thích</text>

  <rect x="46" y="604" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="68" y="615" font-size="10.5" fill="#334155">monitor-app</text>

  <rect x="46" y="630" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="68" y="641" font-size="10.5" fill="#334155">agent-app</text>

  <rect x="46" y="656" width="14" height="14" rx="3" fill="#FFF7ED" stroke="#EA580C" stroke-width="1"/>
  <text x="68" y="667" font-size="10.5" fill="#334155">simulator-app</text>

  <rect x="46" y="682" width="14" height="14" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="68" y="693" font-size="10.5" fill="#334155">monitoring-common</text>

  <rect x="46" y="708" width="14" height="14" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="68" y="719" font-size="10.5" fill="#334155">Email SMTP</text>

  <line x1="46" y1="734" x2="264" y2="734" stroke="#E2E8F0" stroke-width="1"/>

  <path d="M46,754 H84" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#mBlue)"/>
  <text x="94" y="757" font-size="10" fill="#334155">Telemetry · <tspan font-family="Consolas, monospace">UDP 6000</tspan></text>

  <path d="M46,782 H84" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#mGreen)"/>
  <text x="94" y="785" font-size="10" fill="#334155">Cấu hình · <tspan font-family="Consolas, monospace">TCP 5000</tspan></text>

  <path d="M46,810 H84" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mOrange)"/>
  <text x="94" y="813" font-size="10" fill="#334155">Gói kiểm thử</text>
</svg>
