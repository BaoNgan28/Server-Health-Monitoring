  <!-- Mui ten goi xuong -->
  <g stroke="#2563EB" stroke-width="1.8" fill="none">
    <line x1="590" y1="214" x2="590" y2="232" marker-end="url(#arrowDown)"/>
    <line x1="590" y1="340" x2="590" y2="358" marker-end="url(#arrowDown)"/>
    <line x1="590" y1="466" x2="590" y2="484" marker-end="url(#arrowDown)"/>
    <line x1="590" y1="592" x2="590" y2="610" marker-end="url(#arrowDown)"/>
    <line x1="590" y1="718" x2="590" y2="740" marker-end="url(#arrowDown)"/>
  </g>
  <g font-size="10" fill="#94A3B8">
    <text x="604" y="226">gọi xuống</text>
    <text x="604" y="352">gọi xuống</text>
    <text x="604" y="478">gọi xuống</text>
    <text x="604" y="604">gọi xuống</text>
    <text x="604" y="732">gọi xuống</text>
  </g>

  <!-- Cot ghi chu ben phai -->
  <text x="1170" y="104" font-size="10" font-weight="bold" letter-spacing="1.2" fill="#94A3B8">GHI CHÚ</text>
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="1144" y1="266" x2="1168" y2="266"/>
    <line x1="1144" y1="306" x2="1168" y2="306"/>
    <line x1="1144" y1="412" x2="1168" y2="412"/>
    <line x1="1144" y1="538" x2="1168" y2="538"/>
  </g>
  <g>
    <rect x="1170" y="252" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1182" y="270" font-size="11" fill="#64748B">Cửa sổ tổng hợp 5 phút</text>
    <rect x="1170" y="292" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1182" y="310" font-size="11" fill="#64748B">Cảnh báo email</text>
    <rect x="1170" y="398" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1182" y="416" font-size="11" fill="#64748B">Nhận UDP 6000</text>
    <rect x="1170" y="524" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1182" y="542" font-size="11" fill="#64748B">Lưu SQLite</text>
  </g>
</svg>
