# Monitoring client - production profile
# Group 10 - Server Health Monitoring System
#
# Paths are relative to the project root (the folder that holds config, data and logs).

profile.name=production

# --- Network ---------------------------------------------------------------
# UDP port the client listens on for agent telemetry and heartbeats.
monitor.udp.port=6000
# Connect and read timeout for the TCP control channel, in milliseconds.
tcp.timeout.ms=5000

# --- Liveness --------------------------------------------------------------
# An agent with nothing received for this long is declared OFFLINE.
heartbeat.timeout.ms=15000
# How often the liveness sweep runs.
heartbeat.check.interval.ms=2000

# --- Packet security -------------------------------------------------------
# How far a packet timestamp may differ from this machine's clock.
packet.timestamp.tolerance.ms=30000

# --- Storage ---------------------------------------------------------------
database.path=data/monitoring.db

# Per-second detail is kept for an hour, then folded into five-minute buckets,
# which are kept for thirty days.
raw.retention.minutes=60
aggregation.bucket.minutes=5
aggregate.retention.days=30
# How often the aggregation job runs, in seconds.
aggregation.interval.seconds=300

# --- User interface --------------------------------------------------------
# Points kept per realtime chart series. Allowed range: 60 to 300.
chart.window.samples=120
