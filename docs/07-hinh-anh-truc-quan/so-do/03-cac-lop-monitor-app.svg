  <g>
    <rect x="40" y="614" width="1100" height="100" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="74" cy="655" r="11" fill="#64748B"/>
    <text x="74" y="659.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="95" y="660" font-size="15" font-weight="bold" fill="#0F172A">Config</text>
    <text x="95" y="682" font-size="11" fill="#64748B">Cấu hình runtime và SMTP</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1E293B" text-anchor="middle">
      <rect x="300" y="651" width="97" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="348.5" y="668.5">MonitorConfig</text>
      <rect x="407" y="651" width="143" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="478.5" y="668.5">MonitorConfigLoader</text>
      <rect x="560" y="651" width="91" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="605.5" y="668.5">EmailConfig</text>
      <rect x="661" y="651" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="726" y="668.5">EmailConfigLoader</text>
    </g>
