# Monitoring client - demo profile
# Group 10 - Server Health Monitoring System
#
# Identical to monitor.properties except for the retention timings, which are
# compressed so that aggregation can be demonstrated in a few minutes instead of
# an hour. The application code is the same in both profiles: only these numbers
# differ, and they are read through the same loader.
#
# A separate database file is used so a demo cannot disturb production data.

profile.name=demo

monitor.udp.port=6000
tcp.timeout.ms=5000

heartbeat.timeout.ms=15000
heartbeat.check.interval.ms=2000

packet.timestamp.tolerance.ms=30000

database.path=data/monitoring-demo.db

# Raw samples survive one minute, buckets are ten seconds wide, and buckets are
# kept for five minutes. The seconds form takes priority over the minutes and
# days form used by the production profile.
raw.retention.seconds=60
aggregation.bucket.seconds=10
aggregate.retention.seconds=300
aggregation.interval.seconds=15

chart.window.samples=120
