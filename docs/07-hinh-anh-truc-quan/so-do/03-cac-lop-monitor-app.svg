    <text x="74" y="533.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="95" y="534" font-size="15" font-weight="bold" fill="#0F172A">Storage</text>
    <text x="95" y="556" font-size="11" fill="#64748B">SQLite qua DatabaseManager</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1E293B" text-anchor="middle">
      <rect x="300" y="509" width="117" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="358.5" y="526.5">DatabaseManager</text>
      <rect x="427" y="509" width="117" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="485.5" y="526.5">AgentRepository</text>
      <rect x="554" y="509" width="117" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="612.5" y="526.5">MetricRepository</text>
      <rect x="300" y="541" width="110" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="355" y="558.5">AlertRepository</text>
      <rect x="420" y="541" width="124" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="482" y="558.5">DataAccessException</text>
    </g>
